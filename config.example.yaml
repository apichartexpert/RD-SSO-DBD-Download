# ================== ตัวอย่างไฟล์ตั้งค่า TaxDocs ==================
# หน้าเว็บ (run_web.bat) จะสร้าง config.yaml ให้เอง ไม่ต้องแก้ไฟล์นี้
# ถ้าใช้แบบบรรทัดคำสั่ง ให้คัดลอกไฟล์นี้เป็น config.yaml แล้วแก้ค่า

# โฟลเดอร์หลักที่จะเก็บเอกสารทั้งหมด (ใช้ / แทน \ ได้)
output_root: "I:/"

# รายชื่อบริษัท — ใส่ได้หลายบริษัท (เลขผู้เสียภาษี 13 หลัก)
# ถ้าในเอกสารพบเลขของบริษัทใด ระบบจะเก็บเข้าโฟลเดอร์ของบริษัทนั้นให้อัตโนมัติ
companies:
  - name: "บริษัท ตัวอย่าง จำกัด"
    tax_id: "0105500000000"
#  - name: "บริษัท ที่สอง จำกัด"
#    tax_id: "0105500000001"

# ปีในชื่อโฟลเดอร์/ไฟล์: BE = พ.ศ. (2569)  CE = ค.ศ. (2026)
year_format: BE

# true = ให้ยืนยันทีละไฟล์ (แนะนำช่วงแรก)  false = บันทึกอัตโนมัติทั้งหมด
confirm_each_file: true

# เบราว์เซอร์ที่ใช้: msedge (แนะนำ มีในทุกเครื่อง Windows) / chrome / เว้นว่าง = Chromium ของ Playwright
browser_channel: msedge

# โฟลเดอร์เก็บ session การล็อกอิน (ไม่เก็บรหัสผ่าน) — อย่าแชร์โฟลเดอร์นี้ให้ผู้อื่น
browser_profile: browser_profile
